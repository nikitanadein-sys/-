<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          animation: {
            pop: 'pop .18s ease-out',
            fadein: 'fadein .25s ease-out',
          },
          keyframes: {
            pop:   { '0%': { transform: 'scale(.9)', opacity: 0 }, '100%': { transform: 'scale(1)', opacity: 1 } },
            fadein:{ '0%': { transform: 'translateY(6px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } },
          },
        },
      },
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    /* кастомный чекбокс */
    .cb {
      appearance: none;
      width: 1.35rem; height: 1.35rem;
      border-radius: .375rem;
      border: 2px solid rgb(148 163 184 / .6);
      display: inline-grid; place-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: all .15s ease;
    }
    .cb:hover { border-color: rgb(99 102 241); }
    .cb::before {
      content: ''; width: .65rem; height: .65rem;
      transform: scale(0); transition: transform .15s ease-in-out;
      background: white; clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    }
    .cb:checked { background: #6366f1; border-color: #6366f1; }
    .cb:checked::before { transform: scale(1); }
    /* скроллбар */
    .tasks::-webkit-scrollbar { width: 6px; }
    .tasks::-webkit-scrollbar-thumb { background: rgb(148 163 184 / .3); border-radius: 999px; }
  </style>
</head>

<body class="font-sans bg-gradient-to-br from-indigo-50 via-white to-violet-50 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950 min-h-screen text-slate-800 dark:text-slate-100 transition-colors">

  <div class="max-w-2xl mx-auto px-4 py-12 sm:py-16">

    <!-- шапка -->
    <header class="flex items-center justify-between mb-8 animate-fadein">
      <div>
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
          Мои задачи
        </h1>
        <p id="date" class="mt-1 text-sm text-slate-500 dark:text-slate-400 capitalize"></p>
      </div>
      <!-- переключатель темы -->
      <button id="themeBtn" title="Переключить тему"
        class="p-2.5 rounded-xl bg-white dark:bg-slate-800 shadow-sm ring-1 ring-slate-200 dark:ring-slate-700 hover:scale-105 active:scale-95 transition">
        <svg id="iconSun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="iconMoon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </header>

    <!-- форма добавления -->
    <form id="form" class="mb-6 flex gap-2 animate-pop">
      <input id="input" type="text" maxlength="200" autocomplete="off"
        placeholder="Что нужно сделать?"
        class="flex-1 px-4 py-3 rounded-xl bg-white dark:bg-slate-800 ring-1 ring-slate-200 dark:ring-slate-700
               focus:ring-2 focus:ring-indigo-500 outline-none shadow-sm
               placeholder:text-slate-400 dark:placeholder:text-slate-500 transition" />
      <button type="submit"
        class="px-5 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-semibold
               shadow-lg shadow-indigo-500/30 hover:brightness-110 active:scale-95 transition whitespace-nowrap">
        <span class="hidden sm:inline">Добавить</span>
        <svg class="w-5 h-5 sm:hidden" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 4v16m8-8H4"/></svg>
      </button>
    </form>

    <!-- статистика -->
    <div id="progressWrap" class="hidden mb-5 animate-fadein">
      <div class="flex items-center justify-between text-sm text-slate-500 dark:text-slate-400 mb-1.5">
        <span id="statDone"></span>
        <button id="clearDone" class="text-indigo-600 dark:text-indigo-400 hover:underline underline-offset-2">Очистить выполненные</button>
      </div>
      <div class="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
        <div id="bar" class="h-full rounded-full bg-gradient-to-r from-indigo-500 to-violet-500 transition-all duration-500 ease-out" style="width:0%"></div>
      </div>
    </div>

    <!-- фильтры -->
    <div class="flex items-center gap-1.5 mb-4">
      <button data-filter="all"      class="fbtn flex items-center gap-1.5 pl-3.5 pr-2 py-1.5 text-sm rounded-full ring-1 ring-slate-200 dark:ring-slate-700 bg-white dark:bg-slate-800 hover:ring-indigo-400 transition">Все<b class="fcnt hidden min-w-[1.35rem] px-1.5 rounded-full text-[11px] leading-4 bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 text-center">0</b></button>
      <button data-filter="active"   class="fbtn flex items-center gap-1.5 pl-3.5 pr-2 py-1.5 text-sm rounded-full ring-1 ring-slate-200 dark:ring-slate-700 bg-white dark:bg-slate-800 hover:ring-indigo-400 transition">Активные<b class="fcnt hidden min-w-[1.35rem] px-1.5 rounded-full text-[11px] leading-4 bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 text-center">0</b></button>
      <button data-filter="done"     class="fbtn flex items-center gap-1.5 pl-3.5 pr-2 py-1.5 text-sm rounded-full ring-1 ring-slate-200 dark:ring-slate-700 bg-white dark:bg-slate-800 hover:ring-indigo-400 transition">Выполненные<b class="fcnt hidden min-w-[1.35rem] px-1.5 rounded-full text-[11px] leading-4 bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 text-center">0</b></button>
      <span id="counter" class="ml-auto text-xs text-slate-400"></span>
    </div>

    <!-- список -->
    <ul id="list" class="tasks space-y-2 max-h-[55vh] overflow-y-auto pr-1"></ul>

    <!-- пустое состояние -->
    <div id="empty" class="text-center py-14 animate-fadein">
      <div class="text-5xl mb-3">🎯</div>
      <p class="text-slate-500 dark:text-slate-400 font-medium" id="emptyText">Задач пока нет — добавьте первую!</p>
      <p class="text-sm text-slate-400 dark:text-slate-500 mt-1">Введите задачу выше и нажмите Enter</p>
    </div>

    <footer class="mt-10 text-center text-xs text-slate-400 dark:text-slate-500">
      Данные хранятся локально в вашем браузере
    </footer>
  </div>

<script>
(() => {
  const KEY = 'todos_v1';
  const $  = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];

  let todos  = JSON.parse(localStorage.getItem(KEY) || '[]');
  let filter = 'all';

  // ---- тема ----
  const root = document.documentElement;
  if (localStorage.getItem('theme') === 'dark' ||
      (!localStorage.getItem('theme') && matchMedia('(prefers-color-scheme: dark)').matches)) {
    root.classList.add('dark');
  }
  $('#themeBtn').onclick = () => {
    root.classList.toggle('dark');
    localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
    syncThemeIcon();
  };
  function syncThemeIcon() {
    const dark = root.classList.contains('dark');
    $('#iconSun').classList.toggle('hidden', !dark);
    $('#iconMoon').classList.toggle('hidden', dark);
  }
  syncThemeIcon();

  // ---- дата ----
  $('#date').textContent = new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });

  // ---- helpers ----
  const save  = () => localStorage.setItem(KEY, JSON.stringify(todos));
  const uuid  = () => crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
  const esc   = s => s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  // ---- добавление ----
  $('#form').onsubmit = e => {
    e.preventDefault();
    const v = $('#input').value.trim();
    if (!v) return;
    todos.unshift({ id: uuid(), text: v, done: false, created: Date.now() });
    $('#input').value = '';
    $('#input').focus();
    save(); render();
  };

  // ---- действия ----
  function toggle(id) { const t = todos.find(t => t.id === id); if (t) { t.done = !t.done; save(); render(); } }
  function remove(id) {
    const el = $(`[data-item="${id}"]`);
    if (el) { el.style.transition = 'all .2s'; el.style.opacity = 0; el.style.transform = 'translateX(24px)';
             setTimeout(() => { todos = todos.filter(t => t.id !== id); save(); render(); }, 180); }
    else { todos = todos.filter(t => t.id !== id); save(); render(); }
  }
  function editText(id) {
    const t = todos.find(t => t.id === id); if (!t) return;
    const span = $(`[data-edit="${id}"]`);
    const inp = document.createElement('input');
    inp.value = t.text; inp.maxLength = 200;
    Object.assign(inp.style, {
      'width': '100%', 'border': 'none', 'background': 'transparent', 'outline': 'none',
      'color': 'inherit', 'font': 'inherit',
    });
    span.replaceWith(inp);
    inp.focus(); inp.select();
    const commit = ok => {
      if (ok) { t.text = inp.value.trim() || t.text; save(); }
      render();
    };
    inp.onkeydown = e => {
      if (e.key === 'Enter')  commit(true);
      if (e.key === 'Escape') commit(false);
    };
    inp.onblur = () => commit(true);
  }

  $('#clearDone').onclick = () => {
    todos = todos.filter(t => !t.done); save(); render();
  };

  // ---- фильтры ----
  $$('.fbtn').forEach(b => b.onclick = () => {
    filter = b.dataset.filter;
    $$('.fbtn').forEach(x => {
      const on = x === b;
      x.classList.toggle('bg-indigo-600', on);
      x.classList.toggle('text-white', on);
      x.classList.toggle('ring-transparent', on);
      const badge = x.querySelector('.fcnt');
      badge.classList.toggle('bg-indigo-500', on);
      badge.classList.toggle('text-white', on);
    });
    render();
  });
  // подсветка первого фильтра
  $('.fbtn[data-filter="all"]').click();

  // ---- рендер ----
  function render() {
    const list = $('#list');
    const vis  = todos.filter(t => filter === 'all' || (filter === 'done' ? t.done : !t.done));
    const done = todos.filter(t => t.done).length;
    const total = todos.length;
    const pct   = total ? Math.round(done / total * 100) : 0;

    $('#progressWrap').classList.toggle('hidden', total === 0);
    $('#bar').style.width = pct + '%';
    $('#statDone').textContent = `${done} из ${total} выполнено · ${pct}%`;
    $('#counter').textContent  = total ? `${vis.length} покан. задач` : '';

    // счётчики в фильтрах
    const setBadge = (f, n) => {
      const b = $(`.fbtn[data-filter="${f}"] .fcnt`);
      b.textContent = n;
      b.classList.toggle('hidden', !total);
    };
    setBadge('all', total);
    setBadge('active', total - done);
    setBadge('done', done);

    // пустое состояние
    const empty = $('#empty');
    if (vis.length === 0) {
      empty.classList.remove('hidden');
      $('#emptyText').textContent = total === 0
        ? 'Задач пока нет — добавьте первую!'
        : filter === 'done' ? 'Пока нет выполненных задач ✨' : 'Все дела закончены! 🎉';
    } else {
      empty.classList.add('hidden');
    }

    list.innerHTML = vis.map(t => `
      <li data-item="${t.id}"
          class="group flex items-center gap-3 px-4 py-3 rounded-xl bg-white dark:bg-slate-800
                 ring-1 ring-slate-200 dark:ring-slate-700 shadow-sm animate-fadein
                 hover:ring-indigo-300 dark:hover:ring-indigo-600 transition
                 ${t.done ? 'opacity-70' : ''}">
        <input type="checkbox" class="cb" ${t.done ? 'checked' : ''} onchange="app.toggle('${t.id}')" title="Отметить" />
        <span data-edit="${t.id}" class="flex-1 cursor-pointer select-none text-[15px] leading-snug
                  ${t.done ? 'line-through text-slate-400 dark:text-slate-500' : ''}"
              title="Нажмите, чтобы изменить" ondblclick="app.editText('${t.id}')">${esc(t.text)}</span>
        <button onclick="app.editText('${t.id}')" title="Редактировать"
          class="p-1.5 rounded-lg text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 dark:hover:bg-slate-700 opacity-0 group-hover:opacity-100 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
        </button>
        <button onclick="app.remove('${t.id}')" title="Удалить"
          class="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-slate-700 opacity-0 group-hover:opacity-100 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        </button>
      </li>`).join('');
  }

  window.app = { toggle, remove, editText };
  render();
})();
</script>
</body>
</html>
